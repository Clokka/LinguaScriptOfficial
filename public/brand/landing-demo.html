<!doctype html>
<html lang="en"><head><script id="ls-iso-guard">if(/only=\d/.test(location.hash))document.documentElement.style.visibility="hidden"</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Tap-a-Word Landing Lab</title>
</head><body style="margin:0">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
/* Layout: dark studio shell; every version is a 390×844 phone landing page running the same tap-a-word story, lazy-mounted. */
:root{
  --bg:#08080b; --line:#ffffff14; --fg:#f4f4f6; --mute:#9a9aa6;
  --red:#FF453A; --orange:#FF9F0A; --green:#34C759; --gold:#FFD60A;
  --sans:'Inter',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Bricolage Grotesque','Inter',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}
.wrap{max-width:1300px;margin:0 auto}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 em{font-family:var(--serif);font-weight:400;color:var(--green)}
.lead{color:var(--mute);max-width:70ch;margin:.5rem 0 1rem;line-height:1.5}
.story{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;font-size:12px;color:var(--mute)}
.story span{padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:#ffffff08;color:var(--fg);border-radius:999px;padding:7px 14px;font:600 13px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);color:#04130a;border-color:var(--green)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:26px 18px}
.tile{min-width:0}
.meta{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}
.meta b{font:700 12px var(--mono);color:var(--gold)}
.meta span{font-weight:700;font-size:14px}
.meta i{font-style:normal;color:var(--mute);font-size:11px;margin-left:auto}
.frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:30px;overflow:hidden;border:1px solid var(--line);background:#0a0a0d;cursor:pointer}
.st{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden;isolation:isolate}
.st.paused *,.st.paused *::before,.st.paused *::after{animation-play-state:paused!important}
.hint{font-size:11px;color:var(--mute);margin-top:6px}

/* ============ landing engine ============ */
.L{--pbg:#0a0a0d;--pfg:#fff;--pcard:#16161c;--pmute:#9a9aa6;--pline:#ffffff14;--hfont:var(--sans);--sc:#fff;
  --c1:#34C759;--c2:#26A047;--c3:#1B7A35;--c4:#B8EFC8;
  position:absolute;inset:0;background:var(--pbg);color:var(--pfg);font-family:var(--sans);display:flex;flex-direction:column;padding:22px 20px 110px;gap:16px;overflow:hidden}
.L[data-s="2"],.L[data-s="3"]{--sc:var(--red);--c1:#FF453A;--c2:#D63128;--c3:#9E1F18;--c4:#FFC4BF}
.L[data-s="4"]{--sc:var(--orange);--c1:#FF9F0A;--c2:#E08600;--c3:#A85F00;--c4:#FFDDA8}
.L[data-s="5"]{--sc:var(--green)}
.L[data-s="6"]{--sc:var(--gold);--c1:#FFD60A;--c2:#E6B800;--c3:#A88400;--c4:#FFF1A8}
.cham path,.cham rect,.cham circle{transition:fill .6s,stroke .6s}
.nav{display:flex;align-items:center;gap:8px;position:relative;z-index:3}
.nav .lg{font-weight:800;font-size:19px;letter-spacing:-.02em}.nav .lg b{color:var(--green)}
.nav .lang{margin-left:auto;font-size:13px;border:1px solid var(--pline);border-radius:999px;padding:7px 12px}
.H{font-family:var(--hfont);font-size:40px;line-height:1.02;font-weight:900;letter-spacing:-.04em;text-align:center;text-wrap:balance;position:relative;z-index:2}
.H em{font-style:normal;color:var(--green)}
.stage{position:relative;border-radius:24px;background:var(--pcard);border:1px solid var(--pline);padding:16px;z-index:2}
.subbox{border-radius:16px;background:#00000066;padding:18px 12px 14px;text-align:center}
.sub{font-size:26px;font-weight:800;line-height:1.5;letter-spacing:-.01em}
.sub .w{display:inline-block;padding:0 4px;border-radius:10px;transition:color .5s,background .5s,box-shadow .5s,text-shadow .5s;position:relative}
.tr{font-size:14px;color:var(--pmute);margin-top:2px}
/* target word "un" by state */
.L[data-s="0"] .tg{box-shadow:0 0 0 3px var(--orange),0 0 22px var(--orange);animation:hint 1.2s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 3px var(--orange),0 0 6px var(--orange)}}
.L[data-s="1"] .tg{background:#ffffff22}
.L:not([data-s="0"]):not([data-s="1"]) .tg{color:var(--sc)}
.L[data-s="6"] .tg{background:linear-gradient(100deg,#FFD60A 30%,#fff7c2 50%,#FFD60A 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:glim 1.6s linear infinite}
@keyframes glim{from{background-position:120% 0}to{background-position:-120% 0}}
/* ring word style */
.ws-ring .tg{color:inherit!important}
.ws-ring.L:not([data-s="0"]):not([data-s="1"]) .tg{box-shadow:0 0 0 3px var(--sc),0 0 18px var(--sc)}
.ws-ring.L[data-s="6"] .tg{-webkit-text-fill-color:currentColor;animation:ringp 1.2s ease-in-out infinite}
@keyframes ringp{50%{box-shadow:0 0 0 5px var(--gold),0 0 30px var(--gold)}}
/* marker style */
.ws-mark.L:not([data-s="0"]):not([data-s="1"]) .tg{color:#000!important;background:var(--sc);-webkit-text-fill-color:#000}
/* counters */
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:2}
.cnt>div{border-radius:16px;border:1.5px solid;padding:9px 4px;text-align:center;transition:box-shadow .4s,transform .4s;background:var(--pbg)}
.cnt .n{border-color:#FF453A66}.cnt .o{border-color:#FF9F0A66}.cnt .g{border-color:#34C75966}
.cnt small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em}
.cnt .n small{color:var(--red)}.cnt .o small{color:var(--orange)}.cnt .g small{color:var(--green)}
.cnt b{font-size:24px}
.cnt .hot{box-shadow:0 0 0 2px var(--orange),0 0 24px var(--orange);transform:scale(1.04)}
.cov{border-radius:16px;background:var(--pcard);padding:12px 14px;font-size:14px;font-weight:700;position:relative;z-index:2;transition:opacity .4s}
.cov .bar{height:7px;border-radius:9px;background:#ffffff14;margin-top:8px;overflow:hidden}
.cov .bar i{display:block;height:100%;width:2%;background:var(--sc);border-radius:9px;transition:width .8s,background .5s}
.cov small{display:block;font-weight:500;color:var(--pmute);font-size:12px;margin-top:6px}
.cta{position:absolute;left:16px;right:16px;bottom:18px;z-index:6;border-radius:18px;background:var(--green);color:#04130a;text-align:center;font-weight:800;font-size:18px;padding:16px}
/* popup */
.pop{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;border-radius:24px;background:#151821;border:1px solid #ffffff18;padding:18px;transform:translateY(110%);transition:transform .45s cubic-bezier(.16,1,.3,1);color:#fff}
.L[data-s="1"] .pop{transform:none}
.pop h4{margin:0;font-size:30px;color:var(--red);font-weight:800}
.pop .rk{font:600 11px var(--mono);color:#9a9aa6;margin-top:2px}
.pop .bx{border-radius:14px;background:#ffffff08;padding:10px 12px;margin-top:10px}
.pop .bx small{font-size:10px;letter-spacing:.14em;color:#9a9aa6}
.pop .bx div{font-weight:700;font-size:16px}
.pop .sv{margin-top:12px;border-radius:999px;background:var(--green);color:#04130a;text-align:center;font-weight:800;padding:13px}
/* flashcard */
.fc{position:absolute;inset:0;z-index:9;background:#000b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;justify-content:center;padding:24px;gap:14px;opacity:0;pointer-events:none;transition:opacity .4s}
.L[data-s="3"] .fc{opacity:1}
.fc .card{height:260px;border-radius:24px;background:#141824;border:1px solid #ffffff18;display:grid;place-items:center;text-align:center;color:#fff;animation:none}
.L[data-s="3"] .fc .card{animation:flip 1.4s .3s both}
@keyframes flip{0%,40%{transform:rotateY(0)}50%{transform:rotateY(90deg)}60%,100%{transform:rotateY(0)}}
.fc .card .f2{display:none}
.fc .btns{display:flex;gap:10px}.fc .btns div{flex:1;border-radius:16px;padding:14px;text-align:center;font-weight:800}
.fc .ag{border:1.5px solid var(--red);color:var(--red)}.fc .ok{background:var(--green);color:#04130a;animation:press .6s 1.1s both}
@keyframes press{50%{transform:scale(.94)}}
/* confetti */
.cf{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.cf i{position:absolute;top:-20px;width:8px;height:12px;border-radius:2px;opacity:0}
.L[data-s="6"] .cf i{animation:fall 2.2s linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(700px) rotate(540deg)}}
/* how-it-works strip */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:relative;z-index:2}
.how div{border-radius:14px;background:var(--pcard);border:1px solid var(--pline);padding:10px 4px;text-align:center;font-size:11px;font-weight:700;line-height:1.25}
.how div span{display:block;font-size:20px;margin-bottom:4px}
.L[data-s="0"] .how div:nth-child(1),.L[data-s="1"] .how div:nth-child(2),.L[data-s="2"] .how div:nth-child(2),.L[data-s="3"] .how div:nth-child(3),.L[data-s="4"] .how div:nth-child(3),.L[data-s="5"] .how div:nth-child(3),.L[data-s="6"] .how div:nth-child(4){border-color:var(--sc,#fff);box-shadow:0 0 16px -4px var(--sc,#fff)}
.L[data-s="0"] .how div:nth-child(1){--sc:var(--green)}
.works{text-align:center;font-size:12px;color:var(--pmute);position:relative;z-index:2}
.works b{color:var(--pfg)}
.t-brutal .how div{border:2px solid #000;background:#fff}
/* misc motion */
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes drift{to{transform:translate(30px,40px) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.st *,.st *::before,.st *::after{animation:none!important;transition:none!important}}

/* ============ themes ============ */
.t-glass{--pbg:#05060a;--pcard:#ffffff12}
.t-glass .stage,.t-glass .cov,.t-glass .cnt>div{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:#ffffff10;border-color:#ffffff26}
.t-gold{--pbg:linear-gradient(170deg,#000 45%,#3a2c05);--pcard:#14110a;--pline:#ffd60a33}
.t-gold .H em{color:var(--gold)} .t-gold .cta{background:var(--gold)}
.t-paper{--pbg:#f3eee3;--pfg:#1b1a17;--pcard:#fffdf7;--pmute:#6b665c;--pline:#0000001a;--hfont:var(--serif)}
.t-paper .H{font-weight:400;letter-spacing:-.02em;font-size:46px}.t-paper .H em{color:#15803d;font-style:italic}
.t-paper .subbox{background:#1b1a17;color:#fff}.t-paper .cnt>div{background:#fffdf7}.t-paper .nav .lg b{color:#15803d}
.t-neon{--pbg:#020203;--pcard:#07070a}
.t-neon .H{text-shadow:0 0 22px #34C75999}.t-neon .stage{border-color:#34C759;box-shadow:0 0 24px #34C75955,inset 0 0 24px #34C75922}
.t-neon .cnt>div{box-shadow:0 0 14px currentColor}.t-neon .cta{box-shadow:0 0 30px #34C759}
.t-split{--pbg:linear-gradient(180deg,#fff 0 47%,#0a0a0d 47%)}
.t-split .H,.t-split .nav{color:#0a0a0d}.t-split .nav .lang{border-color:#0002}
.t-cinema{--pbg:#0b0505;--pcard:#000}
.t-brutal{--pbg:#FFE14D;--pfg:#000;--pcard:#fff;--pmute:#333;--pline:#000;--hfont:var(--disp)}
.t-brutal .stage,.t-brutal .cov,.t-brutal .cnt>div{border:3px solid #000;box-shadow:5px 5px 0 #000;background:#fff;border-radius:14px}
.t-brutal .subbox{background:#000;color:#fff}.t-brutal .cta{border:3px solid #000;box-shadow:5px 5px 0 #000;border-radius:14px}.t-brutal .H em{color:#000;background:var(--green);padding:0 6px}.t-brutal .nav .lg b{color:#000;text-decoration:underline}
.t-ocean{--pbg:radial-gradient(120% 70% at 50% 0%,#0b3b6b,#04101f 70%);--pcard:#0a1f38cc;--pline:#3fa9ff33}
.t-sunset{--pbg:linear-gradient(180deg,#2b0f3a,#7a1f3d 55%,#ff8a3d);--pcard:#00000055;--pline:#ffffff26}
.t-sunset .cnt>div{background:#00000044}
.t-forest{--pbg:radial-gradient(100% 60% at 50% 0%,#12351d,#050b07 70%);--pcard:#0c1a10}
.t-mono{--pbg:#0a0a0a;--pcard:#111;--hfont:var(--mono)}.t-mono .H{font-size:30px;letter-spacing:-.02em;text-align:left}.t-mono .H em{color:var(--green)}
.t-chrome{--pbg:linear-gradient(160deg,#1a1a1f,#3a3a44 50%,#141418);--pcard:linear-gradient(160deg,#2c2c34,#18181d)}
.t-chrome .H{background:linear-gradient(180deg,#fff,#9aa 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}.t-chrome .H em{color:transparent}
.t-candy{--pbg:#fff0f6;--pfg:#2a0f1f;--pcard:#fff;--pmute:#7a5a6a;--pline:#ff5fa233;--hfont:var(--disp)}
.t-candy .subbox{background:#2a0f1f;color:#fff}.t-candy .H em{color:#e0337a}.t-candy .cta{background:#2a0f1f;color:#fff}.t-candy .cnt>div{background:#fff}
</style>

<div class="wrap">
  <h1>Tap-a-word landing, <em>many ways</em></h1>
  <p class="lead">Phone versions of the homepage demo. Each one plays the LinguaScript story on its own, and you can tap a phone to jump to the next step:</p>
  <div class="story"><span>1 · tap "un"</span><span>2 · meaning pops up → Save</span><span style="color:var(--red)">3 · red = new</span><span>4 · flashcard</span><span style="color:var(--orange)">5 · orange = learning</span><span style="color:var(--green)">6 · green = known</span><span style="color:var(--gold)">7 · gold + confetti</span></div>
  <div class="chips" id="flt" role="toolbar" aria-label="Filter versions"></div>
  <div class="grid" id="g"></div>
</div>

<script>
const CHAM=(w=58)=>`<svg class="cham" width="${w}" viewBox="14 76 372 184" aria-hidden="true"><path d="M20 236 Q200 222 380 240 L380 254 Q200 236 20 250 Z" fill="#5b4332"/><path d="M272 176 C322 168 348 190 344 214 C340 236 316 242 304 230 C295 220 302 206 314 207" fill="none" style="stroke:var(--c2)" stroke-width="15" stroke-linecap="round"/><rect x="233" y="196" width="15" height="38" rx="7.5" style="fill:var(--c2)"/><path d="M136 196 Q128 118 205 106 Q276 96 285 160 Q290 202 244 208 L164 210 Q140 208 136 196 Z" style="fill:var(--c1)"/><path d="M158 130 q7 -14 14 0 q7 -14 14 0 q7 -14 14 0 q7 -14 14 0 q7 -14 14 0 q7 -14 14 0 q7 -14 14 0 l-2 10 q-49 -10 -94 2 Z" style="fill:var(--c3)"/><path d="M150 196 Q152 168 178 166 Q166 190 190 206 L164 208 Q152 206 150 196 Z" style="fill:var(--c4)"/><rect x="182" y="198" width="15" height="40" rx="7.5" style="fill:var(--c2)"/><circle cx="189.5" cy="238" r="9" style="fill:var(--c2)"/><path d="M162 118 Q160 92 134 88 Q104 84 88 112 Q74 138 84 162 Q94 186 126 188 Q152 189 160 168 Q166 148 162 118 Z" style="fill:var(--c1)"/><path d="M82 148 Q104 162 128 154" fill="none" stroke="#3d2b1f" stroke-width="4.5" stroke-linecap="round"/><circle cx="118" cy="126" r="21" style="fill:var(--c4)"/><circle cx="118" cy="126" r="11.5" fill="#fffef9"/><circle cx="122.27" cy="124.58" r="5.5" fill="#241a12"/><circle cx="124.77" cy="122.08" r="2" fill="#fff" opacity=".9"/></svg>`;
const NAVC=`<svg width="34" viewBox="14 76 372 184" aria-hidden="true"><path d="M136 196 Q128 118 205 106 Q276 96 285 160 Q290 202 244 208 L164 210 Q140 208 136 196 Z" fill="#34C759"/><path d="M162 118 Q160 92 134 88 Q104 84 88 112 Q74 138 84 162 Q94 186 126 188 Q152 189 160 168 Q166 148 162 118 Z" fill="#34C759"/><circle cx="118" cy="126" r="11.5" fill="#fff"/><circle cx="122" cy="125" r="5.5" fill="#241a12"/><path d="M272 176 C322 168 348 190 344 214 C340 236 316 242 304 230" fill="none" stroke="#26A047" stroke-width="15" stroke-linecap="round"/></svg>`;
const HL={
 shows:`Learn languages while <em>watching your favourite shows.</em>`,
 tap:`Tap a word. <em>Watch it change colour.</em>`,
 green:`Every word you learn <em>turns green.</em>`,
 colours:`<span style="color:var(--red)">Red.</span> <span style="color:var(--orange)">Orange.</span> <em>Green.</em> <span style="color:var(--gold)">Gold.</span>`,
 subs:`Subtitles that <em>learn with you.</em>`,
 cham:`Be a <em>chameleon.</em> Blend into French.`};
const SUB=`<span class="w">Je</span> <span class="w">voudrais</span> <span class="w tg">un</span> <span class="w">café,</span> <span class="w">s'il</span> <span class="w">vous</span> <span class="w">plaît.</span>`;
const nav=()=>`<div class="nav">${NAVC}<span class="lg">lingua<b>script</b></span><span class="lang">🇫🇷 French ▾</span></div>`;
const head=k=>`<div class="H">${HL[k]}</div>`;
const subBlock=(cls="")=>`<div class="subbox ${cls}"><div class="sub" translate="no">${SUB}</div><div class="tr">I would like a coffee, please.</div></div>`;
const counters=()=>`<div class="cnt"><div class="n"><small>NEW</small><b data-c="n">0</b></div><div class="o"><small>LEARNING</small><b data-c="o">0</b></div><div class="g"><small>KNOWN</small><b data-c="g">0</b></div></div>`;
const cov=()=>`<div class="cov"><span data-cov>Tap a coloured word to save it.</span><div class="bar"><i></i></div><small>(un is #7 of the most common words in French)</small></div>`;
const overlays=()=>`<div class="pop"><div style="display:flex;justify-content:space-between;align-items:center"><h4 translate="no">un</h4><span style="width:40px;height:40px;border-radius:12px;background:#ffffff10;display:grid;place-items:center">🔊</span></div><div class="rk">#7 most common French word</div><div class="bx"><small>TRANSLATION</small><div>a, one</div></div><div class="bx"><small>EXAMPLE</small><div translate="no">un café · un ami</div></div><div class="sv">＋ Save to Flashcards</div></div><div class="fc"><div class="card"><div><div style="font-size:11px;letter-spacing:.2em;color:#9a9aa6">FRENCH · TAP TO FLIP</div><div style="font-size:64px;font-weight:900;margin-top:6px" translate="no">un</div><div style="color:#9a9aa6">a, one</div></div></div><div class="btns"><div class="ag">✕ Again</div><div class="ok">✓ Got it!</div></div></div><div class="cf">${Array.from({length:40},(_,i)=>`<i style="left:${(i*37)%100}%;top:${-20-(i*29)%160}px;width:${6+i%3*3}px;background:${["#FF453A","#FF9F0A","#34C759","#FFD60A","#7b6cff"][i%5]};animation-duration:${1.6+(i%7)*.18}s;animation-delay:${(i%9)*.05}s"></i>`).join("")}</div>`;
const how=()=>`<div class="how"><div><span>🎬</span>Watch a show</div><div><span>👆</span>Tap a word</div><div><span>🃏</span>Review it</div><div><span>✨</span>Green → gold</div></div><div class="works">Works on <b>YouTube</b> · <b>Netflix</b> · <b>Crunchyroll</b><br>Free · No card needed</div>`;
const cta=(t="Try LinguaScript free")=>`<div class="cta">${t}</div>`;

/* layouts of the demo stage */
const ST={
 card:()=>`<div class="stage"><div style="margin:-2px 0 8px">${CHAM()}</div>${subBlock()}</div>`,
 video:()=>`<div class="stage" style="padding:0;overflow:hidden"><div style="height:250px;background:radial-gradient(60% 60% at 70% 30%,#f0b46c,#8b4a2b 60%,#2a140c);position:relative"><div style="position:absolute;left:24px;top:40px;width:90px;height:130px;border-radius:50% 50% 12px 12px;background:#3a2218"></div><div style="position:absolute;right:40px;top:80px;width:70px;height:90px;border-radius:12px;background:#e9e2d0;box-shadow:0 0 0 8px #c9b89a"></div><div style="position:absolute;left:12px;top:12px;font:700 10px var(--mono);background:#0008;padding:3px 7px;border-radius:6px">▶ 0:42 · Café scene</div><div style="position:absolute;left:10px;right:10px;bottom:8px">${subBlock()}</div><div style="position:absolute;right:12px;top:10px">${CHAM(46)}</div></div></div>`,
 tv:()=>`<div class="stage" style="padding:10px;border-radius:18px;background:#111;border:6px solid #222"><div style="border-radius:8px;background:linear-gradient(160deg,#1d2b44,#0b0f18);padding:60px 8px 10px;position:relative"><div style="position:absolute;left:12px;top:10px">${CHAM(44)}</div>${subBlock()}</div><div style="width:80px;height:6px;margin:8px auto 0;background:#222;border-radius:3px"></div></div>`,
 chat:()=>`<div class="stage" style="background:transparent;border:0;padding:0;display:flex;flex-direction:column;gap:8px"><div style="align-self:flex-start;display:flex;gap:8px;align-items:flex-end">${CHAM(48)}<div style="background:var(--pcard);border:1px solid var(--pline);border-radius:18px 18px 18px 4px;padding:12px 14px"><div class="sub" style="font-size:22px;text-align:left" translate="no">${SUB}</div></div></div><div style="align-self:flex-end;background:#34C75922;color:#bff5cc;border-radius:18px 18px 4px 18px;padding:10px 14px;font-size:14px">I would like a coffee, please.</div></div>`,
 book:()=>`<div class="stage" style="background:#f6f0e2;color:#2a241c;border:0"><div style="display:flex;justify-content:space-between;align-items:center;font:600 11px var(--mono);color:#8a7d66"><span>CHAPITRE 1</span>${CHAM(40)}</div><div class="sub" style="font-family:var(--serif);font-weight:400;font-size:30px;text-align:left;line-height:1.35;margin-top:8px" translate="no">${SUB}</div><div class="tr" style="color:#8a7d66;font-style:italic">I would like a coffee, please.</div></div>`,
 big:()=>`<div class="stage" style="background:transparent;border:0;padding:0;text-align:center"><div style="display:flex;justify-content:center">${CHAM(110)}</div><div class="sub" style="font-size:32px;margin-top:8px" translate="no">${SUB}</div><div class="tr">I would like a coffee, please.</div></div>`};

/* extras (ambient graphics) */
const EX={
 none:()=>"",
 aurora:()=>`<div style="position:absolute;inset:-60px;z-index:0;background:radial-gradient(35% 25% at 25% 20%,#34c75966,transparent),radial-gradient(30% 25% at 80% 45%,#ff9f0a55,transparent),radial-gradient(35% 25% at 30% 80%,#ff453a44,transparent);filter:blur(30px);animation:drift 9s ease-in-out infinite alternate"></div>`,
 letters:()=>`<div style="position:absolute;inset:0;z-index:0;pointer-events:none">${"é è à ç ô û ï ê ù â".split(" ").map((c,i)=>`<span style="position:absolute;left:${(i*41)%92}%;top:${(i*67)%90}%;font:900 ${30+i%3*16}px var(--serif);color:#ffffff10;animation:fl ${4+i%3}s ease-in-out ${i*.3}s infinite">${c}</span>`).join("")}</div>`,
 marquee:()=>`<div style="position:relative;z-index:2;overflow:hidden;margin:-4px -20px;white-space:nowrap"><div style="display:inline-flex;gap:8px;animation:mq 18s linear infinite">${Array.from({length:2},()=>"de la le et être avoir je il que pas en un ne on ce une vous dans".split(" ").map((w,i)=>`<span style="padding:6px 10px;border-radius:10px;background:var(--pcard);font-size:13px;font-weight:700"><span style="font:600 10px var(--mono);color:var(--pmute)">#${i+1}</span> <span style="color:${i<4?"var(--green)":i<9?"var(--orange)":"var(--red)"}">${w}</span></span>`).join("")).join("")}</div></div>`,
 grid:()=>`<div style="position:absolute;inset:0;z-index:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%)"></div>`,
 orbs:()=>`<div style="position:absolute;inset:0;z-index:0;pointer-events:none">${["#FF453A","#FF9F0A","#34C759","#FFD60A"].map((c,i)=>`<i style="position:absolute;width:${60+i*20}px;height:${60+i*20}px;border-radius:50%;left:${[5,70,10,65][i]}%;top:${[18,30,62,75][i]}%;background:radial-gradient(circle at 35% 30%,#fff8,${c} 50%,transparent 72%);opacity:.35;animation:fl ${5+i}s ease-in-out infinite"></i>`).join("")}</div>`,
 spot:()=>`<div style="position:absolute;left:50%;top:-80px;width:520px;height:520px;translate:-50% 0;z-index:0;background:conic-gradient(from 180deg,transparent,#ffd60a22,transparent 30%);animation:spin 14s linear infinite;border-radius:50%"></div>`,
 letterbox:()=>`<div style="position:absolute;left:0;right:0;top:0;height:14px;background:#000;z-index:5"></div>`};

/* progress widget variants (replace .cov) */
const PW={
 bar:cov,
 dots:()=>`<div class="cov"><span data-cov>Tap a coloured word to save it.</span><div style="display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin-top:8px">${Array.from({length:50},(_,i)=>`<i style="aspect-ratio:1;border-radius:50%;background:${i==6?"var(--sc)":"#ffffff18"};transition:background .5s;${i==6?"box-shadow:0 0 6px var(--sc)":""}"></i>`).join("")}</div><small>Top 50 French words · un is #7</small></div>`,
 ring:()=>`<div class="cov" style="display:flex;align-items:center;gap:14px"><div style="width:58px;height:58px;border-radius:50%;flex:none;background:conic-gradient(var(--sc) 0 7.2deg,#ffffff14 7.2deg);display:grid;place-items:center;transition:background .5s"><div style="width:44px;height:44px;border-radius:50%;background:var(--pcard);display:grid;place-items:center;font-size:12px">1/50</div></div><div><span data-cov>Tap a coloured word to save it.</span><small>un is #7 of the most common words</small></div></div>`};

const V=[];const add=(name,tag,cfg)=>V.push({name,tag,cfg});
const build=c=>`<div class="L t-${c.t||"base"} ${c.ws?"ws-"+c.ws:""}" data-s="0">${(EX[c.x||"none"])()}${nav()}${c.top||""}${head(c.h||"shows")}${c.mid||""}${ST[c.st||"card"]()}${c.noCnt?"":counters()}${(PW[c.pw||"bar"])()}${c.after??how()}${cta(c.cta)}${overlays()}</div>`;

/* ---------- the versions ---------- */
add("Current, polished","Classic",{});
add("Rings instead of colour","Classic",{ws:"ring"});
add("Highlighter words","Classic",{ws:"mark",h:"tap"});
add("Big chameleon","Classic",{st:"big",h:"cham",pw:"ring"});
add("50-dot progress","Classic",{pw:"dots",h:"green"});
add("Four colours headline","Classic",{h:"colours",x:"grid"});

add("Liquid glass","Glass",{t:"glass",x:"aurora"});
add("Glass + rings","Glass",{t:"glass",x:"aurora",ws:"ring",h:"tap"});
add("Glass video","Glass",{t:"glass",x:"aurora",st:"video",h:"subs",pw:"ring"});
add("Glass orbs","Glass",{t:"glass",x:"orbs",h:"colours",pw:"dots"});

add("Gold to black","Premium",{t:"gold",x:"spot",cta:"Start free — it's on us"});
add("Gold rings","Premium",{t:"gold",x:"spot",ws:"ring",st:"big",h:"cham"});
add("Chrome","Premium",{t:"chrome",h:"subs",pw:"ring"});
add("Neon","Premium",{t:"neon",x:"grid",ws:"ring",h:"tap"});

add("Video scene","Cinema",{st:"video",h:"shows"});
add("Cinema letterbox","Cinema",{t:"cinema",x:"letterbox",st:"video",h:"subs",cta:"▶ Watch your first show"});
add("TV set","Cinema",{st:"tv",h:"shows",pw:"dots"});
add("Video + word ticker","Cinema",{st:"video",x:"marquee",mid:"",h:"green"});

add("Split black / white","Editorial",{t:"split",h:"tap"});
add("Paper & serif","Editorial",{t:"paper",st:"book",h:"subs"});
add("Paper ring","Editorial",{t:"paper",ws:"ring",h:"green",pw:"ring"});
add("Book page","Editorial",{st:"book",h:"cham",x:"letters"});

add("Brutalist yellow","Bold",{t:"brutal",h:"tap",ws:"mark"});
add("Candy","Bold",{t:"candy",h:"colours"});
add("Terminal mono","Bold",{t:"mono",x:"grid",h:"tap"});
add("Sunset","Bold",{t:"sunset",x:"letters",h:"shows",ws:"ring"});

add("Ocean","Calm",{t:"ocean",x:"orbs",h:"subs"});
add("Forest","Calm",{t:"forest",x:"letters",h:"cham",st:"big"});
add("Chat bubbles","Calm",{st:"chat",h:"tap"});
add("Chat + glass","Calm",{t:"glass",x:"aurora",st:"chat",h:"subs",pw:"dots"});

add("Word ticker on top","Motion",{x:"marquee",h:"shows"});
add("Floating accents","Motion",{x:"letters",h:"tap",pw:"ring"});
add("Spotlight sweep","Motion",{x:"spot",h:"colours",st:"big"});
add("Orbs & dots","Motion",{x:"orbs",pw:"dots",h:"green",ws:"ring"});
add("Aurora video","Motion",{x:"aurora",st:"video",h:"tap"});
add("TV + rings + gold","Motion",{t:"gold",st:"tv",ws:"ring",h:"subs"});

/* ---------- engine ---------- */
const DUR=[1700,2000,1500,2400,1500,1500,2600];
const COV=["Tap a coloured word to save it.","Tap a coloured word to save it.","1 of the 50 most common French words added","1 of the 50 most common French words added","Learning 1 of the 50 most common French words","You know <b style=\"color:var(--green)\">1</b> of the 50 most common French words","✨ Gold: time for a quick review of <b>un</b>"];
function setS(root,s){root.dataset.s=s;const n=s>=2&&s<4?1:0,o=s==4?1:0,g=s>=5?1:0;
 root.querySelectorAll("[data-c=n]").forEach(e=>e.textContent=n);root.querySelectorAll("[data-c=o]").forEach(e=>e.textContent=o);root.querySelectorAll("[data-c=g]").forEach(e=>e.textContent=g);
 root.querySelectorAll(".cnt>div").forEach(d=>d.classList.remove("hot"));const hot=s==2?".n":s==4?".o":s==5?".g":null;if(hot)root.querySelector(".cnt "+hot)?.classList.add("hot");
 root.querySelectorAll("[data-cov]").forEach(e=>e.innerHTML=COV[s]);root.querySelectorAll(".cov .bar i").forEach(e=>e.style.width=s>=2?"6%":"2%");
 if(s==6)root.querySelectorAll(".cf i").forEach(i=>{i.style.animation="none";i.offsetWidth;i.style.animation=""});}
const live=new Set();
setInterval(()=>{const now=performance.now();live.forEach(st=>{const L=st.firstElementChild;if(!L)return;if(now>=st._next){const s=(+L.dataset.s+1)%7;setS(L,s);st._next=now+DUR[s]}})},120);

const tags=["All",...new Set(V.map(v=>v.tag))];
const flt=document.getElementById("flt"),g=document.getElementById("g");
tags.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t+(t==="All"?` · ${V.length}`:"");b.setAttribute("aria-pressed",t==="All");b.onclick=()=>{[...flt.children].forEach(c=>c.setAttribute("aria-pressed",c===b));[...g.children].forEach(el=>el.hidden=!(t==="All"||el.dataset.tag===t))};flt.appendChild(b)});
V.forEach((v,i)=>{const el=document.createElement("article");el.className="tile";el.dataset.tag=v.tag;el.innerHTML=`<div class="meta"><b>${String(i+1).padStart(2,"0")}</b><span>${v.name}</span><i>${v.tag}</i></div><div class="frame" role="button" tabindex="0" aria-label="${v.name}: tap for the next step"><div class="st"></div></div>`;g.appendChild(el)});
const fit=fr=>{fr.firstChild.style.transform=`scale(${fr.clientWidth/390})`};
const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));
const step=fr=>{const st=fr.firstChild,L=st.firstElementChild;if(!L)return;const s=(+L.dataset.s+1)%7;setS(L,s);st._next=performance.now()+DUR[s]+2500};
const io=new IntersectionObserver(es=>es.forEach(e=>{const st=e.target.firstChild,i=[...g.children].indexOf(e.target.closest(".tile"));
 if(e.isIntersecting){if(!st.dataset.on){st.innerHTML=build(V[i].cfg);st.dataset.on=1;st._next=performance.now()+DUR[0]+(i%4)*400}st.classList.remove("paused");live.add(st)}
 else{st.classList.add("paused");live.delete(st);if(Math.abs(e.boundingClientRect.top)>3000){st.innerHTML="";delete st.dataset.on}}}),{rootMargin:"200px"});
document.querySelectorAll(".frame").forEach(fr=>{ro.observe(fr);io.observe(fr);fit(fr);fr.addEventListener("click",()=>step(fr));fr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();step(fr)}})});
</script>
