<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Frequency Decks Lab</title>
</head><body style="margin:0">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: dark studio shell; each version is a 1100×500 section scaled into its tile, lazy-mounted. */
:root{
  --bg:#08080b; --panel:#101015; --line:#ffffff14; --fg:#f4f4f6; --mute:#9a9aa6;
  --red:#FF453A; --orange:#FF9F0A; --green:#34C759; --gold:#FFD60A; --violet:#7b6cff;
  --sans:'Inter',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 em{font-family:var(--serif);font-weight:400;color:var(--gold)}
.lead{color:var(--mute);max-width:62ch;margin:.5rem 0 1.2rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:#ffffff08;color:var(--fg);border-radius:999px;padding:7px 14px;font:600 13px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);color:#04130a;border-color:var(--green)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:22px}
.tile{min-width:0}
.meta{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.meta b{font:700 12px var(--mono);color:var(--gold)}
.meta span{font-weight:700}
.meta i{font-style:normal;color:var(--mute);font-size:12px;margin-left:auto}
.frame{position:relative;width:100%;aspect-ratio:1100/500;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a0a0d}
.st{position:absolute;left:0;top:0;width:1100px;height:500px;transform-origin:0 0;overflow:hidden;isolation:isolate}
.st.paused *, .st.paused *::before, .st.paused *::after{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.st *,.st *::before,.st *::after{animation:none!important;transition:none!important}}

/* ===== shared section pieces ===== */
.S{position:absolute;inset:0;padding:64px 70px;display:flex;align-items:center;gap:40px;background:#0b0b0e;color:#fff;font-family:var(--sans)}
.tx{flex:0 0 430px;position:relative;z-index:2}
.eb{font:700 12px var(--sans);letter-spacing:.32em;color:var(--orange);text-transform:uppercase}
.hd{font-size:46px;line-height:1.02;font-weight:900;letter-spacing:-.035em;margin:14px 0 14px}
.hd .g{color:var(--green)} .hd .o{color:var(--orange)} .hd .y{color:var(--gold)}
.sb{font-size:17px;color:#c9c9d2;line-height:1.45}
.ft{margin-top:22px;font-size:13px;color:#8d8d99}
.btn{display:inline-flex;margin-top:24px;background:var(--green);color:#04130a;font-weight:800;padding:13px 22px;border-radius:999px;font-size:15px;box-shadow:0 12px 36px -10px var(--green)}
.vis{flex:1;position:relative;height:100%}
.glowL{position:absolute;left:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,#3b2fb066,transparent);pointer-events:none}
.glowR{position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,#ff9f0a33,transparent);pointer-events:none}
.card{position:absolute;width:210px;height:270px;border-radius:22px;background:linear-gradient(160deg,#1d1d24,#111116);box-shadow:0 30px 60px -20px #000,inset 0 1px 0 #ffffff14;border-top:3px solid var(--c);padding:20px;color:#fff}
.card .k{font:600 10px var(--sans);letter-spacing:.24em;color:#9b9ba8;text-transform:uppercase}
.card .t{font-size:38px;font-weight:900;line-height:.95;letter-spacing:-.03em;color:var(--c);margin-top:12px}
.card .u{font-size:13px;color:#b7b7c2;margin-top:6px}
.card .w{position:absolute;left:16px;right:16px;bottom:16px;border-radius:14px;background:#0b0b0f;padding:12px 14px}
.card .w b{display:block;font-size:20px} .card .w small{color:#a0a0ab;font-size:12px}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
</style>

<div class="wrap">
  <h1>Frequency decks, <em>many ways</em></h1>
  <p class="lead">Versions of the "Top 50 to Top 3,000" flashcard section. Each one uses the real deck colours and the same copy so you can compare the layout. The numbers in progress examples are sample data. Only the versions on screen animate.</p>
  <div class="chips" id="flt" role="toolbar" aria-label="Filter versions"></div>
  <div class="grid" id="g"></div>
</div>

<script>
const D=[
 {n:"Top 50",c:"var(--red)",w:"être",m:"to be",r:"#2"},
 {n:"Top 500",c:"var(--orange)",w:"vraiment",m:"really",r:"#212"},
 {n:"Top 1,000",c:"var(--green)",w:"pourtant",m:"however",r:"#706"},
 {n:"Top 3,000",c:"var(--gold)",w:"plaît",m:"please",r:"#2,934"}];
const HX=["#FF453A","#FF9F0A","#34C759","#FFD60A"];
const HD=`Frequency decks.<br><span class="g">Top 50</span> to <span class="o">Top 3,000</span>.`;
const SB=`Learn the words people actually say — first.`;
const FACT=`100 words ≈ 50% of written English · 3,000 ≈ 95% of everyday conversation`;
const T=(o={})=>`<div class="tx"${o.s?` style="${o.s}"`:""}><div class="eb"${o.ec?` style="color:${o.ec}"`:""}>Flashcards</div><div class="hd"${o.hs?` style="${o.hs}"`:""}>${o.h||HD}</div><div class="sb"${o.ss?` style="${o.ss}"`:""}>${SB}</div>${o.btn===false?"":`<span class="btn"${o.bs?` style="${o.bs}"`:""}>Start Top 50 →</span>`}${o.fact?`<div class="ft">${FACT}</div>`:""}</div>`;
const C=(d,st="")=>`<div class="card" style="--c:${d.c};${st}"><div class="k">French · deck</div><div class="t">${d.n.replace(" ","<br>")}</div><div class="u">most common words</div><div class="w"><b>${d.w}</b><small>${d.m}</small></div></div>`;
const words="de la le et être avoir je il que pas en un ne on ce une vous dans pour qui tu faire mais dire avec tout aller voir pouvoir bien vouloir où savoir là si comme moi mon y nous rien très ici venir falloir".split(" ");

const V=[];
const add=(name,tag,html)=>V.push({name,tag,html});

/* ---------- Cards ---------- */
add("Fan of decks","Cards",()=>`<div class="S"><div class="glowL"></div><div class="glowR"></div>${T()}<div class="vis">${D.map((d,i)=>C(d,`left:${40+i*70}px;top:${110-i*14}px;transform:rotate(${-24+i*9}deg);z-index:${i}`)).join("")}</div></div>`);

add("Fan that breathes","Cards",()=>`<style>.v2 .card{transition:transform .6s;animation:v2 6s ease-in-out infinite}@keyframes v2{50%{translate:0 -8px}}.v2 .vis:hover .card{rotate:0deg}</style><div class="S v2"><div class="glowL"></div>${T()}<div class="vis">${D.map((d,i)=>C(d,`left:${70+i*75}px;top:${100-i*10}px;transform:rotate(${-18+i*12}deg);animation-delay:${i*.4}s;z-index:${i}`)).join("")}</div></div>`);

add("Straight stack","Cards",()=>`<div class="S">${T()}<div class="vis">${D.map((d,i)=>C(d,`left:${100+i*34}px;top:${70+i*30}px;z-index:${i};box-shadow:0 20px 40px -10px #000`)).join("")}</div></div>`);

add("Four in a row","Cards",()=>`<div class="S" style="flex-direction:column;align-items:flex-start;padding:46px 70px">${T({btn:false,s:"flex:none",hs:"font-size:38px;margin:8px 0 4px"})}<div style="display:flex;gap:18px;margin-top:6px">${D.map((d,i)=>C(d,`position:relative;width:225px;height:220px;animation:up .7s ${i*.1}s both`)).join("")}</div></div>`);

add("Poker hand","Cards",()=>`<div class="S" style="flex-direction:column;justify-content:flex-start;text-align:center;padding-top:46px">${T({btn:false,s:"flex:none;max-width:640px"})}<div style="position:absolute;left:50%;bottom:-120px">${D.map((d,i)=>C(d,`left:-105px;bottom:0;transform-origin:50% 140%;transform:rotate(${-27+i*18}deg)`)).join("")}</div></div>`);

add("Swipe stack","Cards",()=>`<style>.v6 .top{animation:v6 4s ease-in-out infinite}@keyframes v6{0%,40%{transform:none}55%{transform:translateX(220px) rotate(18deg);opacity:0}56%{transform:none;opacity:0}75%,100%{opacity:1}}.v6 .tag{position:absolute;font:900 22px var(--sans);padding:6px 14px;border:3px solid;border-radius:10px}</style><div class="S v6">${T()}<div class="vis">${C(D[1],"left:150px;top:100px;transform:scale(.94)")}${C(D[3],"left:150px;top:90px",)}<div class="top" style="position:absolute;left:150px;top:80px;width:210px;height:270px">${C(D[2],"left:0;top:0")}<div class="tag" style="color:var(--green);left:22px;top:24px;rotate:-14deg">KNOWN</div></div><div style="position:absolute;left:120px;bottom:44px;display:flex;gap:70px;font-weight:800;color:#9a9aa6"><span>← again</span><span style="color:var(--green)">know it →</span></div></div></div>`);

add("Flip card","Cards",()=>`<style>.v7 .f{position:absolute;left:150px;top:90px;width:260px;height:320px;perspective:900px}.v7 .in{position:absolute;inset:0;transform-style:preserve-3d;animation:v7 5s ease-in-out infinite}@keyframes v7{0%,40%{transform:none}50%,90%{transform:rotateY(180deg)}}.v7 .fa{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:grid;place-items:center;text-align:center;border-top:4px solid var(--gold)}.v7 .fr{background:linear-gradient(160deg,#1f1f27,#121217)}.v7 .bk{background:linear-gradient(160deg,#2b2408,#151208);transform:rotateY(180deg)}</style><div class="S v7"><div class="glowR"></div>${T()}<div class="vis"><div class="f"><div class="in"><div class="fa fr"><div><div class="eb" style="color:#9a9aa6">#2,934 · Top 3,000</div><div style="font-size:64px;font-weight:900;margin-top:10px">plaît</div></div></div><div class="fa bk"><div><div class="eb" style="color:var(--gold)">Meaning</div><div style="font-size:46px;font-family:var(--serif);margin-top:10px">please</div><div style="color:#a99;margin-top:8px">s'il vous plaît</div></div></div></div></div></div></div>`);

add("Polaroids","Cards",()=>`<div class="S" style="background:#0d0c0a">${T({ec:"var(--gold)"})}<div class="vis">${D.map((d,i)=>`<div style="position:absolute;left:${30+i*120}px;top:${60+(i%2)*90}px;width:170px;background:#f3efe6;color:#111;padding:12px 12px 30px;border-radius:4px;transform:rotate(${[-8,6,-3,9][i]}deg);box-shadow:0 20px 40px #000a"><div style="height:120px;background:${d.c};border-radius:2px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff">${d.w}</div><div style="font-family:var(--serif);font-size:22px;margin-top:8px">${d.n}</div><div style="font-size:12px;color:#555">${d.m}</div></div>`).join("")}</div></div>`);

add("Tickets","Cards",()=>`<div class="S">${T()}<div class="vis" style="display:flex;flex-direction:column;justify-content:center;gap:12px">${D.map((d,i)=>`<div style="display:flex;height:76px;border-radius:14px;background:#15151b;overflow:hidden;animation:up .6s ${i*.12}s both"><div style="width:120px;background:${d.c};color:#000;display:grid;place-items:center;font-weight:900">${d.n}</div><div style="flex:1;padding:12px 18px;border-left:2px dashed #0b0b0e"><b style="font-size:20px">${d.w}</b><div style="color:#9a9aa6;font-size:13px">${d.m} · rank ${d.r}</div></div><div style="width:110px;display:grid;place-items:center;font:700 11px var(--mono);color:#777;border-left:2px dashed #2a2a33">ADMIT 50</div></div>`).join("")}</div></div>`);

add("Index cards (paper)","Cards",()=>`<div class="S" style="background:#efe9dc;color:#1b1a17">${T({ec:"#c2410c",hs:"color:#1b1a17",ss:"color:#4a463e",h:`Frequency decks.<br><span style="color:#15803d">Top 50</span> to <span style="color:#c2410c">Top 3,000</span>.`})}<div class="vis">${D.map((d,i)=>`<div style="position:absolute;left:${40+i*60}px;top:${70+i*40}px;width:300px;height:180px;background:#fffdf7;border-radius:6px;box-shadow:0 10px 24px #0002;background-image:repeating-linear-gradient(#fffdf7 0 27px,#cfe0f5 27px 28px);padding:14px 18px;border-top:6px solid ${d.c}"><div style="font:700 11px var(--mono);color:#888">${d.n.toUpperCase()}</div><div style="font-family:var(--serif);font-size:40px;line-height:1.2">${d.w}</div><div style="font-size:14px;color:#555">${d.m}</div></div>`).join("")}</div></div>`);

/* ---------- Glass ---------- */
add("Liquid glass","Glass",()=>`<div class="S" style="background:#06060a"><div style="position:absolute;inset:0;background:radial-gradient(30% 45% at 70% 35%,#34c75988,transparent),radial-gradient(25% 40% at 85% 75%,#ff9f0a88,transparent),radial-gradient(25% 35% at 55% 80%,#ff453a77,transparent);filter:blur(30px);animation:fl 8s ease-in-out infinite"></div>${T()}<div class="vis">${D.map((d,i)=>`<div style="position:absolute;left:${30+i*95}px;top:${80+(i%2)*60}px;width:190px;height:240px;border-radius:26px;background:linear-gradient(160deg,#ffffff2a,#ffffff08);border:1px solid #ffffff40;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:20px;box-shadow:inset 0 1px 0 #fff6,0 30px 60px -20px #000"><div class="k" style="font:600 10px var(--sans);letter-spacing:.24em;color:#fffb">FRENCH</div><div style="font-size:34px;font-weight:900;margin-top:10px;line-height:1">${d.n.replace(" ","<br>")}</div><div style="position:absolute;bottom:18px;left:20px"><b style="font-size:20px">${d.w}</b><div style="font-size:12px;color:#fffa">${d.m}</div></div></div>`).join("")}</div></div>`);

add("Glass panel, one card","Glass",()=>`<div class="S" style="background:linear-gradient(120deg,#0b0b0e,#14100a)"><div class="glowR" style="right:60px;bottom:-60px;background:radial-gradient(closest-side,#ffd60a55,transparent)"></div><div style="position:absolute;inset:40px;border-radius:30px;background:#ffffff08;border:1px solid #ffffff1c;backdrop-filter:blur(10px)"></div>${T()}<div class="vis">${C(D[3],"left:150px;top:60px;width:240px;height:310px;transform:rotate(6deg);box-shadow:0 0 80px -10px #ffd60a66,0 30px 60px #000")}</div></div>`);

add("Glass chips on a mesh","Glass",()=>`<style>.v13 .ch{position:absolute;padding:10px 16px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(12px);font-weight:700;animation:fl 5s ease-in-out infinite}</style><div class="S v13" style="background:#07070b"><div style="position:absolute;inset:0;background:conic-gradient(from 200deg at 72% 50%,#ff453a55,#ff9f0a55,#34c75955,#ffd60a44,#ff453a55);filter:blur(60px)"></div>${T()}<div class="vis">${words.slice(0,16).map((w,i)=>`<div class="ch" style="left:${(i*97)%470}px;top:${30+((i*61)%330)}px;animation-delay:${i*.3}s"><span style="color:${["#ff8a80","#ffc56b","#7fe39b","#ffe66d"][Math.min(3,i>>2)]}">#${i+1}</span> ${w}</div>`).join("")}</div></div>`);

add("Frosted shelf","Glass",()=>`<div class="S" style="background:radial-gradient(60% 80% at 80% 50%,#1b2a1f,#0a0a0d)">${T()}<div class="vis" style="display:flex;align-items:flex-end;gap:16px;padding-bottom:70px">${D.map((d,i)=>`<div style="flex:1;height:${150+i*55}px;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#ffffff1f,#ffffff06);border:1px solid #ffffff2a;border-top:3px solid ${d.c};backdrop-filter:blur(14px);padding:16px;animation:up .8s ${i*.12}s both"><b style="color:${d.c};font-size:20px">${d.n}</b><div style="font-size:13px;color:#cfd">${d.w} · ${d.m}</div></div>`).join("")}</div><div style="position:absolute;left:470px;right:60px;bottom:58px;height:2px;background:#ffffff22"></div></div>`);

/* ---------- Progress ---------- */
add("Staircase","Progress",()=>`<div class="S">${T({fact:true})}<div class="vis" style="display:flex;align-items:flex-end;gap:14px;padding-bottom:40px">${D.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;gap:8px"><b style="color:${d.c}">${d.n}</b><div style="height:${70+i*85}px;border-radius:16px;background:linear-gradient(180deg,${d.c},transparent 140%);box-shadow:0 0 40px -10px ${d.c};position:relative;animation:up .8s ${i*.15}s both"><span style="position:absolute;left:12px;bottom:12px;color:#000;font-weight:800">${d.w}</span></div></div>`).join("")}</div></div>`);

add("Zipf curve","Progress",()=>{const pts=[];for(let x=0;x<=500;x+=10){const r=1+x*6;pts.push(`${x},${320-Math.log(r)/Math.log(3001)*290}`)}return `<div class="S">${T({fact:true,btn:false})}<div class="vis"><svg viewBox="-20 -20 560 380" width="560" height="380" style="position:absolute;top:40px"><defs><linearGradient id="zg" x1="0" x2="1"><stop offset="0" stop-color="#FF453A"/><stop offset=".35" stop-color="#FF9F0A"/><stop offset=".7" stop-color="#34C759"/><stop offset="1" stop-color="#FFD60A"/></linearGradient></defs><path d="M0,320 L${pts.join(" L")} L500,320Z" fill="url(#zg)" opacity=".12"/><polyline points="${pts.join(" ")}" fill="none" stroke="url(#zg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900" style="animation:v16 2.4s .2s forwards"/><line x1="0" y1="320" x2="510" y2="320" stroke="#ffffff22"/>${[[8,"Top 50"],[83,"Top 500"],[166,"Top 1,000"],[500,"Top 3,000"]].map(([x,l],i)=>`<g><circle cx="${x}" cy="${320-Math.log(1+x*6)/Math.log(3001)*290}" r="7" fill="${["#FF453A","#FF9F0A","#34C759","#FFD60A"][i]}"/><text x="${x}" y="345" fill="#a0a0ab" font-size="13" text-anchor="${i==3?"end":"start"}" font-family="Inter">${l}</text></g>`).join("")}<text x="0" y="-4" fill="#a0a0ab" font-size="12" font-family="Inter">how much of what you hear you understand →</text></svg><style>@keyframes v16{to{stroke-dashoffset:0}}</style></div></div>`});

add("Rings","Progress",()=>`<div class="S">${T()}<div class="vis"><svg width="380" height="380" viewBox="0 0 380 380" style="position:absolute;left:90px;top:20px;rotate:-90deg">${D.map((d,i)=>{const r=170-i*34,c=2*Math.PI*r,v=[1,1,.82,.31][i];return `<circle cx="190" cy="190" r="${r}" fill="none" stroke="#ffffff10" stroke-width="22"/><circle cx="190" cy="190" r="${r}" fill="none" stroke="${HX[i]}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" style="filter:drop-shadow(0 0 8px ${["#FF453A","#FF9F0A","#34C759","#FFD60A"][i]}88)"/>`}).join("")}</svg><div style="position:absolute;left:230px;top:180px;text-align:center;width:100px"><b style="font-size:26px">931</b><div style="font-size:11px;color:#999">sample<br>words known</div></div></div></div>`);

add("60 decks grid","Progress",()=>`<style>.v18 i{border-radius:7px;display:grid;place-items:center;font:700 10px var(--mono);color:#0008;animation:v18 3s ease-in-out infinite}@keyframes v18{50%{filter:brightness(1.35)}}</style><div class="S v18">${T({btn:false,fact:true})}<div class="vis" style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-content:center">${Array.from({length:60},(_,i)=>{const col=i<1?"#FF453A":i<10?"#FF9F0A":i<20?"#34C759":"#FFD60A";const done=i<23;return `<i style="height:48px;background:${done?col:"#ffffff0c"};color:${done?"#0009":"#fff4"};animation-delay:${(i%10)*.1+(i/10|0)*.1}s">${(i+1)*50}</i>`}).join("")}</div></div>`);

add("Milestone track","Progress",()=>`<div class="S" style="flex-direction:column;align-items:stretch;justify-content:center;gap:50px">${T({s:"flex:none;max-width:700px",btn:false,hs:"font-size:42px"})}<div style="position:relative;height:110px"><div style="position:absolute;left:0;right:0;top:40px;height:8px;border-radius:9px;background:#ffffff12"></div><div style="position:absolute;left:0;width:62%;top:40px;height:8px;border-radius:9px;background:linear-gradient(90deg,#FF453A,#FF9F0A,#34C759,#FFD60A);box-shadow:0 0 20px #34c75988"></div>${D.map((d,i)=>`<div style="position:absolute;left:${[2,30,58,96][i]}%;top:26px;translate:-50% 0;text-align:center"><div style="width:36px;height:36px;border-radius:50%;background:${i<3?d.c:"#1a1a20"};border:3px solid ${d.c};margin:0 auto"></div><b style="display:block;margin-top:10px;color:${d.c}">${d.n}</b><small style="color:#999">${d.w}</small></div>`).join("")}</div></div>`);

/* ---------- render ---------- */
const tags=["All",...new Set(V.map(v=>v.tag))];let cur="All";
const flt=document.getElementById("flt"),g=document.getElementById("g");
tags.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t+(t==="All"?` · ${V.length}`:"");b.setAttribute("aria-pressed",t===cur);b.onclick=()=>{cur=t;[...flt.children].forEach(c=>c.setAttribute("aria-pressed",c===b));[...g.children].forEach(el=>el.hidden=!(t==="All"||el.dataset.tag===t))};flt.appendChild(b)});
V.forEach((v,i)=>{const el=document.createElement("article");el.className="tile";el.dataset.tag=v.tag;el.innerHTML=`<div class="meta"><b>${String(i+1).padStart(2,"0")}</b><span>${v.name}</span><i>${v.tag}</i></div><div class="frame"><div class="st"></div></div>`;g.appendChild(el)});
const fit=fr=>{const st=fr.firstChild;st.style.transform=`scale(${fr.clientWidth/1100})`};
const ro=new ResizeObserver(es=>es.forEach(e=>fit(e.target)));
const io=new IntersectionObserver(es=>es.forEach(e=>{const st=e.target.firstChild,i=[...g.children].indexOf(e.target.closest(".tile"));if(e.isIntersecting){if(!st.dataset.on){try{st.innerHTML=V[i].html()}catch(err){st.innerHTML=`<p style="padding:40px;color:#f88">${err}</p>`}st.dataset.on=1}st.classList.remove("paused")}else{st.classList.add("paused");if(Math.abs(e.boundingClientRect.top)>2500){st.innerHTML="";delete st.dataset.on}}}),{rootMargin:"250px"});
document.querySelectorAll(".frame").forEach(fr=>{ro.observe(fr);io.observe(fr);fit(fr)});
</script>
