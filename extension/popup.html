<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinguaScript</title>
  <link rel="stylesheet" href="brand.css" />
  <style>
    body { width: 320px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    main { padding: 16px; display: grid; gap: 12px; }
    .hidden { display: none !important; }
    h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    p.lead { font-size: 13px; color: var(--muted); line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: 14px var(--font); }
    input:focus { border-color: var(--green); outline: none; }
    .error { font-size: 12px; color: var(--red); min-height: 16px; }
    .row { display: flex; gap: 8px; }
    .links { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .links a { color: var(--muted); text-decoration: none; }
    .links a:hover { color: var(--fg); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .goal-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .goal-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .goal-count { font-size: 24px; font-weight: 800; }
    .goal-count small { font-size: 14px; color: var(--muted); font-weight: 600; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width .4s ease; }
    .streak { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    .streak b { color: var(--orange); }
    .lang { font-size: 12px; color: var(--muted); }
    .who { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
    .link-btn { background: none; border: 0; color: var(--muted); font: 12px var(--font); cursor: pointer; padding: 2px 4px; }
    .link-btn:hover { color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/logo.svg" alt="" /><span>Lingua<span class="script">Script</span></span></div>
    <button class="link-btn hidden" id="logout-btn">Log out</button>
  </header>

  <!-- Logged out -->
  <main id="auth-panel" class="hidden">
    <div>
      <h1>Learn with YouTube &amp; Netflix</h1>
      <p class="lead">Log in to colour words by your flashcard decks and save new words as you watch.</p>
    </div>
    <form id="login-form" style="display:grid; gap:10px;">
      <div><label for="email">Email</label><input type="email" id="email" autocomplete="email" required /></div>
      <div><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required /></div>
      <button class="btn btn-primary" id="login-btn" type="submit">Log in</button>
      <div class="error" id="auth-error" role="alert"></div>
    </form>
    <a class="btn btn-ghost" href="https://linguascript.co.uk/auth?mode=signup" target="_blank" rel="noopener noreferrer">Create a free account</a>
    <div class="links">
      <a href="https://linguascript.co.uk/auth?mode=forgot" target="_blank" rel="noopener noreferrer">Forgot password?</a>
      <a href="https://linguascript.co.uk" target="_blank" rel="noopener noreferrer">linguascript.co.uk</a>
    </div>
  </main>

  <!-- Logged in -->
  <main id="main-panel" class="hidden">
    <div class="card">
      <div class="goal-top">
        <span class="goal-label">Today’s words</span>
        <span class="goal-count"><span id="goal-saved">0</span><small> / <span id="goal-target">–</span></small></span>
      </div>
      <div class="bar"><div id="goal-bar"></div></div>
    </div>
    <div class="row" style="justify-content: space-between; align-items: center;">
      <span class="streak">🔥 <b id="streak">0</b> day streak</span>
      <span class="lang" id="lang-label"></span>
    </div>
    <div class="row">
      <a class="btn btn-primary" style="flex:1" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a class="btn btn-primary" style="flex:1" href="https://www.netflix.com" target="_blank" rel="noopener noreferrer">Netflix</a>
    </div>
    <a class="btn btn-ghost" href="https://linguascript.co.uk/flashcards" target="_blank" rel="noopener noreferrer">Review flashcards</a>
    <div class="links">
      <span class="who" id="user-email"></span>
      <a href="https://linguascript.co.uk" target="_blank" rel="noopener noreferrer">Open LinguaScript</a>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
