<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Spawn Celebration — Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Fake watch-page backdrop so the celebration is seen in context */
    .backdrop {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at top, hsl(262 60% 22% / 0.55), transparent 70%),
        #09090b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px;
    }
    .fake-video {
      width: min(720px, 80vw); aspect-ratio: 16/9;
      background: linear-gradient(180deg, hsl(240 5% 8%), hsl(240 6% 5%));
      border: 1px solid hsl(240 5% 18%);
      border-radius: 16px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 28px;
    }
    .fake-subtitle { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
    .fake-subtitle .known { color: #22c55e; }
    .fake-subtitle .learning { color: #fb923c; }
    .fake-subtitle .new { color: #ef4444; }

    /* Controls */
    .controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center;
      background: hsl(240 6% 8% / 0.85);
      border: 1px solid hsl(240 5% 20%);
      backdrop-filter: blur(12px);
      padding: 10px 14px; border-radius: 14px;
      z-index: 50;
    }
    .controls button {
      font: inherit; font-size: 13px; font-weight: 600;
      color: white; border: none; border-radius: 10px;
      padding: 9px 14px; cursor: pointer;
      background: linear-gradient(135deg, hsl(262 83% 58%), hsl(258 90% 76%));
    }
    .controls button.gold { background: linear-gradient(135deg, hsl(27 96% 61%), hsl(48 96% 53%)); color: #1c1400; }
    .controls select {
      font: inherit; font-size: 13px; color: white;
      background: hsl(240 5% 12%); border: 1px solid hsl(240 5% 22%);
      border-radius: 10px; padding: 8px 10px;
    }

    /* ---- Word-saved toast celebration (bottom-right, non-blocking) ---- */
    .word-toast {
      position: fixed; right: 24px; bottom: 96px; z-index: 60;
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none;
    }
    .word-toast canvas { width: 150px; height: 150px; display: block; }
    .xp-chip {
      margin-top: -14px;
      background: hsl(240 6% 8% / 0.9);
      border: 1px solid hsl(262 83% 58% / 0.5);
      box-shadow: 0 0 20px hsl(262 83% 58% / 0.35);
      border-radius: 999px; padding: 6px 14px;
      font-size: 13px; font-weight: 700;
      opacity: 0; transform: translateY(6px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .xp-chip.show { opacity: 1; transform: translateY(0); }
    .xp-chip .plus { color: #a78bfa; }

    /* ---- Level-up celebration (centered, takes the moment) ---- */
    .levelup-overlay {
      position: fixed; inset: 0; z-index: 70;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: hsl(240 6% 5% / 0.6);
      backdrop-filter: blur(4px);
      opacity: 0; transition: opacity .3s ease;
      pointer-events: none;
    }
    .levelup-overlay.show { opacity: 1; }
    .levelup-stage { position: relative; width: 320px; height: 320px; }
    .levelup-stage::before {
      content: ""; position: absolute; inset: 10%;
      background: radial-gradient(circle, hsl(48 96% 53% / 0.28), hsl(27 96% 61% / 0.12) 55%, transparent 72%);
      border-radius: 50%;
      animation: glowPulse 1.6s ease-in-out infinite;
    }
    @keyframes glowPulse { 50% { transform: scale(1.12); opacity: .8; } }
    .levelup-stage canvas { position: relative; width: 320px; height: 320px; display: block; }
    .levelup-title {
      font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, hsl(27 96% 61%), hsl(48 96% 53%));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      opacity: 0; transform: translateY(10px) scale(.9);
      transition: opacity .35s ease .15s, transform .35s cubic-bezier(.34,1.56,.64,1) .15s;
    }
    .levelup-sub { font-size: 15px; color: hsl(240 5% 65%); margin-top: 6px; opacity: 0; transition: opacity .35s ease .3s; }
    .levelup-overlay.show .levelup-title { opacity: 1; transform: translateY(0) scale(1); }
    .levelup-overlay.show .levelup-sub { opacity: 1; }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="fake-video">
      <div class="fake-subtitle">
        <span class="known">Je</span> <span class="known">voudrais</span>
        <span class="learning">apprendre</span> <span class="new">davantage</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <select id="petSelect"></select>
    <button id="btnWord">💾 Word saved (+5 XP)</button>
    <button id="btnLevel" class="gold">⭐ Level up!</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import confetti from "canvas-confetti";

    const PETS = [
      ["sparrow", "/pets/Sparrow_Animations.glb"],
      ["gecko", "/pets/Gecko_Animations.glb"],
      ["colobus", "/pets/Colobus_Animations.glb"],
      ["muskrat", "/pets/Muskrat_Animations.glb"],
      ["pudu", "/pets/Pudu_Animations.glb"],
      ["herring", "/pets/Herring_Animations.glb"],
      ["inkfish", "/pets/Inkfish_Animations.glb"],
      ["taipan", "/pets/Taipan_Animations.glb"],
    ];

    const select = document.getElementById("petSelect");
    for (const [id] of PETS) {
      const o = document.createElement("option");
      o.value = id; o.textContent = id[0].toUpperCase() + id.slice(1);
      select.appendChild(o);
    }

    const loader = new GLTFLoader();
    const cache = new Map();
    async function loadPet(id) {
      if (cache.has(id)) return cache.get(id);
      const url = PETS.find(([p]) => p === id)[1];
      const p = new Promise((res, rej) => loader.load(url, res, undefined, rej));
      cache.set(id, p);
      return p;
    }

    // easeOutBack — the elastic "pop" for spawn-in
    const easeOutBack = (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };

    function makeStage(canvasSize) {
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(canvasSize, canvasSize);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 0.35, 3.2);
      camera.lookAt(0, 0, 0);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x443388, 2.2));
      const dir = new THREE.DirectionalLight(0xffffff, 2.4);
      dir.position.set(2, 4, 3);
      scene.add(dir);
      return { renderer, scene, camera };
    }

    function fitModel(gltf) {
      const model = gltf.scene;
      // the model object is shared across celebrations — detach it from any
      // previous (possibly scaled-out) wrapper and reset its transform BEFORE
      // measuring, or the fit compensates for stale parent/self scale
      if (model.parent) model.parent.remove(model);
      model.scale.setScalar(1);
      model.position.set(0, 0, 0);
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 1.5 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      const center = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += 0.05;
      const wrapper = new THREE.Group();
      wrapper.add(model);
      return wrapper;
    }

    function playClip(gltf, model, name, { loop = false } = {}) {
      const mixer = new THREE.AnimationMixer(model);
      const clip = THREE.AnimationClip.findByName(gltf.animations, name);
      if (!clip) return { mixer };
      const action = mixer.clipAction(clip);
      action.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
      action.clampWhenFinished = true;
      action.play();
      return { mixer, action, clip };
    }

    // ------------------------------------------------------------------
    // Celebration 1: WORD SAVED — small toast, bottom-right, non-blocking
    // Pet pops in with elastic scale, plays Bounce once, XP chip slides up,
    // whole thing despawns after ~2.2s. Video never pauses.
    // ------------------------------------------------------------------
    async function celebrateWordSaved(petId, xp = 5) {
      const gltf = await loadPet(petId);
      const el = document.createElement("div");
      el.className = "word-toast";
      const { renderer, scene, camera } = makeStage(150);
      el.appendChild(renderer.domElement);
      const chip = document.createElement("div");
      chip.className = "xp-chip";
      chip.innerHTML = `<span class="plus">+${xp} XP</span> Word saved!`;
      el.appendChild(chip);
      document.body.appendChild(el);

      const wrapper = fitModel(gltf);
      scene.add(wrapper);
      const { mixer } = playClip(gltf, wrapper.children[0], "Bounce", { loop: true });

      const SPAWN = 0.45, HOLD = 1.5, EXIT = 0.25;
      const start = performance.now();
      requestAnimationFrame(() => setTimeout(() => chip.classList.add("show"), 250));

      const clock = new THREE.Clock();
      let raf;
      (function tick() {
        const t = (performance.now() - start) / 1000;
        mixer.update(clock.getDelta());
        if (t < SPAWN) {
          wrapper.scale.setScalar(Math.max(0.001, easeOutBack(t / SPAWN)));
        } else if (t < SPAWN + HOLD) {
          wrapper.scale.setScalar(1);
        } else if (t < SPAWN + HOLD + EXIT) {
          const k = 1 - (t - SPAWN - HOLD) / EXIT;
          wrapper.scale.setScalar(Math.max(0.001, k));
          el.style.opacity = k;
          chip.classList.remove("show");
        } else {
          cancelAnimationFrame(raf);
          renderer.dispose();
          el.remove();
          return;
        }
        renderer.render(scene, camera);
        raf = requestAnimationFrame(tick);
      })();
    }

    // ------------------------------------------------------------------
    // Celebration 2: LEVEL UP — centered takeover moment (~3s)
    // Dim + blur backdrop, golden glow, pet spawns with elastic pop and
    // plays Spin then loops Bounce, confetti burst, gradient title.
    // ------------------------------------------------------------------
    async function celebrateLevelUp(petId, level = 7) {
      const gltf = await loadPet(petId);
      const overlay = document.createElement("div");
      overlay.className = "levelup-overlay";
      const stage = document.createElement("div");
      stage.className = "levelup-stage";
      const { renderer, scene, camera } = makeStage(320);
      stage.appendChild(renderer.domElement);
      const title = document.createElement("div");
      title.className = "levelup-title";
      title.textContent = `Level ${level}!`;
      const sub = document.createElement("div");
      sub.className = "levelup-sub";
      sub.textContent = "Your pet is proud of you 🎉";
      overlay.append(stage, title, sub);
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add("show"));

      const wrapper = fitModel(gltf);
      scene.add(wrapper);
      const model = wrapper.children[0];
      const spin = playClip(gltf, model, "Spin");
      let mixer = spin.mixer;
      if (spin.action && spin.clip) {
        setTimeout(() => {
          const b = playClip(gltf, model, "Bounce", { loop: true });
          mixer = b.mixer;
        }, spin.clip.duration * 1000);
      }

      confetti({
        particleCount: 120, spread: 75, startVelocity: 42,
        origin: { y: 0.55 },
        colors: ["#7c3aed", "#a78bfa", "#fb923c", "#facc15", "#22c55e"],
      });

      const SPAWN = 0.5, HOLD = 2.4, EXIT = 0.3;
      const start = performance.now();
      const clock = new THREE.Clock();
      let raf;
      (function tick() {
        const t = (performance.now() - start) / 1000;
        mixer.update(clock.getDelta());
        if (t < SPAWN) {
          wrapper.scale.setScalar(Math.max(0.001, easeOutBack(t / SPAWN)));
        } else if (t < SPAWN + HOLD) {
          wrapper.scale.setScalar(1);
        } else if (t < SPAWN + HOLD + EXIT) {
          overlay.classList.remove("show");
        } else {
          cancelAnimationFrame(raf);
          renderer.dispose();
          overlay.remove();
          return;
        }
        renderer.render(scene, camera);
        raf = requestAnimationFrame(tick);
      })();
    }

    document.getElementById("btnWord").onclick = () => celebrateWordSaved(select.value);
    document.getElementById("btnLevel").onclick = () => celebrateLevelUp(select.value);

    // Deterministic triggers for automated screenshots:
    //   ?auto=word&pet=pudu   |   ?auto=level&pet=sparrow
    const params = new URLSearchParams(location.search);
    const autoPet = params.get("pet") || "pudu";
    select.value = autoPet;
    if (params.get("auto") === "word") loadPet(autoPet).then(() => celebrateWordSaved(autoPet));
    if (params.get("auto") === "level") loadPet(autoPet).then(() => celebrateLevelUp(autoPet));
  </script>
</body>
</html>
