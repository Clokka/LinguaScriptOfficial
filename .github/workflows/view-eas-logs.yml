name: View EAS build logs

# Run this to dump the logs of an existing EAS build into GitHub's UI.
# Useful when a build failed and we need to see why.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "EAS build ID (from the build URL, e.g. e7b80d70-27b9-457f-a2a7-4a3ef372be38), or 'latest' for the newest Android build"
        required: true
        type: string

jobs:
  view:
    name: eas build:view
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI + jq
        run: |
          npm install -g eas-cli@latest
          sudo apt-get -qq install -y jq

      - name: Install mobile deps (eas build:view needs plugins resolved)
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Fetch build metadata
        id: meta
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          BUILD_ID="${{ github.event.inputs.build_id }}"
          if [ "$BUILD_ID" = "latest" ]; then
            BUILD_ID=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')
            echo "Latest Android build: $BUILD_ID"
          fi
          eas build:view "$BUILD_ID" --json > /tmp/build.json 2>/tmp/view.err
          VIEW_EXIT=$?
          cat /tmp/build.json
          echo ""
          echo "-- view stderr --"
          cat /tmp/view.err
          echo "view_exit=$VIEW_EXIT" >> $GITHUB_OUTPUT

      - name: Extract log-file URLs
        id: logs
        run: |
          set +e
          if [ ! -s /tmp/build.json ]; then
            echo "No build.json — cannot extract logs" | tee /tmp/logs.txt
            exit 0
          fi
          # Log files live under different paths in different eas-cli versions.
          # Try a few known ones.
          URLS=$(jq -r '
            (.logFiles // .artifacts.buildArtifactsUrl // [])
            | if type == "array" then .[] else . end
          ' /tmp/build.json 2>/dev/null)
          if [ -z "$URLS" ]; then
            URLS=$(jq -r 'recurse | strings | select(test("^https?://.*(\\.log|logs|xcodebuild|gradle)"; "i"))' /tmp/build.json | sort -u)
          fi
          if [ -z "$URLS" ]; then
            echo "No log URLs found in build metadata."
            echo "" > /tmp/logs.txt
            exit 0
          fi
          echo "$URLS"
          : > /tmp/logs.txt
          for u in $URLS; do
            echo "=========== $u ===========" >> /tmp/logs.txt
            # EAS serves log files gzipped; unzip when needed.
            curl -sSL "$u" -o /tmp/log.part || echo "(curl failed for $u)" >> /tmp/logs.txt
            if gzip -t /tmp/log.part 2>/dev/null; then zcat /tmp/log.part >> /tmp/logs.txt; else cat /tmp/log.part >> /tmp/logs.txt; fi
            echo "" >> /tmp/logs.txt
          done
          echo ""
          echo "-- error lines --"
          grep -n -i -E "error|what went wrong|failed|exception" /tmp/logs.txt | grep -v -i "warning" | head -n 150
          echo "-- captured logs (last 400 lines) --"
          tail -n 400 /tmp/logs.txt

      - name: Post everything to run summary
        if: always()
        run: |
          {
            echo "## 🔍 EAS build log for ${{ github.event.inputs.build_id }}"
            echo ""
            echo "**Build page:** https://expo.dev/accounts/rowanawesome1s-team/projects/linguascript-chameleon/builds/${{ github.event.inputs.build_id }}"
            echo ""
            echo "### Build metadata (eas build:view --json)"
            echo ""
            echo '```json'
            cat /tmp/build.json 2>/dev/null || echo "(no metadata)"
            echo '```'
            echo ""
            echo "### Raw log files"
            echo ""
            echo '```'
            tail -n 400 /tmp/logs.txt 2>/dev/null || echo "(no logs captured)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
