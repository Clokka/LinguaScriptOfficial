name: Build Android APK

# Trigger manually from the Actions tab.
# Requires repo secret: EXPO_TOKEN (from expo.dev/settings/access-tokens)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Trigger EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform android \
            --non-interactive \
            --no-wait \
            --json \
            --output /tmp/build.json 2>/tmp/eas.log || \
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform android \
            --non-interactive \
            --no-wait \
            --json > /tmp/build.json

      - name: Post build link to run summary
        run: |
          echo "=== EAS output ==="
          cat /tmp/build.json || true
          BUILD_ID=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            process.stdout.write(b.id);
          " 2>/dev/null || echo "")

          BUILD_URL=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const url = (b.artifacts && b.artifacts.buildUrl) || '';
            process.stdout.write(url);
          " 2>/dev/null || echo "")

          OWNER=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const owner = (b.project && b.project.ownerAccount && b.project.ownerAccount.name) || 'rowanawesome1s-team';
            process.stdout.write(owner);
          " 2>/dev/null || echo "rowanawesome1s-team")

          SLUG=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const slug = (b.project && b.project.slug) || 'linguascript-chameleon';
            process.stdout.write(slug);
          " 2>/dev/null || echo "linguascript-chameleon")

          BUILD_PAGE="https://expo.dev/accounts/${OWNER}/projects/${SLUG}/builds/${BUILD_ID}"

          {
            echo "## 🦎 EAS build triggered"
            echo ""
            echo "The build is running on Expo's servers. Check back in ~10-15 minutes."
            echo ""
            echo "### 📱 Watch the build + get your APK:"
            echo ""
            echo "👉 **[Open build page on expo.dev]($BUILD_PAGE)**"
            echo ""
            if [ -n "$BUILD_URL" ]; then
              echo "When complete, the APK download link will appear here:"
              echo ""
              echo "👉 [Download APK]($BUILD_URL)"
              echo ""
            fi
            echo "### Install on Android"
            echo "1. Open the build page link above on your phone"
            echo "2. Wait for status to say **Finished**"
            echo "3. Tap **Download** to get the .apk file"
            echo "4. Open it from your Downloads — tap Install"
            echo ""
            echo "**Build ID:** \`$BUILD_ID\`"
            echo "**Profile:** \`${{ github.event.inputs.profile }}\`"
          } >> $GITHUB_STEP_SUMMARY
