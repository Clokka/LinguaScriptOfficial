name: Build Android APK

# Trigger manually from the Actions tab.
# Requires repo secret: EXPO_TOKEN (from expo.dev/settings/access-tokens)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    # Was 10, which was fine when the job only queued the build. It now waits
    # for EAS to finish, so it needs headroom for the poll step below.
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Trigger EAS build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform android \
            --non-interactive \
            --no-wait \
            --json \
            --output /tmp/build.json 2>/tmp/eas.log || \
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform android \
            --non-interactive \
            --no-wait \
            --json > /tmp/build.json

      - name: Post build link to run summary
        run: |
          echo "=== EAS output ==="
          cat /tmp/build.json || true
          BUILD_ID=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            process.stdout.write(b.id);
          " 2>/dev/null || echo "")

          BUILD_URL=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const url = (b.artifacts && b.artifacts.buildUrl) || '';
            process.stdout.write(url);
          " 2>/dev/null || echo "")

          OWNER=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const owner = (b.project && b.project.ownerAccount && b.project.ownerAccount.name) || 'rowanawesome1s-team';
            process.stdout.write(owner);
          " 2>/dev/null || echo "rowanawesome1s-team")

          SLUG=$(node -e "
            const raw = require('fs').readFileSync('/tmp/build.json','utf8').trim();
            const data = JSON.parse(raw);
            const b = Array.isArray(data) ? data[0] : data;
            const slug = (b.project && b.project.slug) || 'linguascript-chameleon';
            process.stdout.write(slug);
          " 2>/dev/null || echo "linguascript-chameleon")

          BUILD_PAGE="https://expo.dev/accounts/${OWNER}/projects/${SLUG}/builds/${BUILD_ID}"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILD_PAGE=$BUILD_PAGE" >> $GITHUB_ENV

          {
            echo "## 🦎 EAS build triggered"
            echo ""
            echo "The build is running on Expo's servers. Check back in ~10-15 minutes."
            echo ""
            echo "### 📱 Watch the build + get your APK:"
            echo ""
            echo "👉 **[Open build page on expo.dev]($BUILD_PAGE)**"
            echo ""
            if [ -n "$BUILD_URL" ]; then
              echo "When complete, the APK download link will appear here:"
              echo ""
              echo "👉 [Download APK]($BUILD_URL)"
              echo ""
            fi
            echo "### Install on Android"
            echo "1. Open the build page link above on your phone"
            echo "2. Wait for status to say **Finished**"
            echo "3. Tap **Download** to get the .apk file"
            echo "4. Open it from your Downloads — tap Install"
            echo ""
            echo "**Build ID:** \`$BUILD_ID\`"
            echo "**Profile:** \`${{ github.event.inputs.profile }}\`"
          } >> $GITHUB_STEP_SUMMARY

      # --no-wait above keeps the trigger fast, but on its own it made this job
      # report success the moment the build was QUEUED — a green tick that said
      # nothing about whether an APK existed. Poll until EAS reaches a terminal
      # state so the job's conclusion is actually meaningful.
      - name: Wait for the EAS build to finish
        if: env.BUILD_ID != ''
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        timeout-minutes: 45
        run: |
          echo "Polling EAS build $BUILD_ID …"
          while true; do
            eas build:view "$BUILD_ID" --json > /tmp/status.json 2>/dev/null || true
            STATUS=$(node -e "
              try {
                const b = JSON.parse(require('fs').readFileSync('/tmp/status.json','utf8'));
                process.stdout.write(String(b.status || '').toUpperCase());
              } catch (e) { process.stdout.write('UNKNOWN'); }
            ")
            echo "  status: ${STATUS:-UNKNOWN}"
            case "$STATUS" in
              FINISHED)
                APK=$(node -e "
                  const b = JSON.parse(require('fs').readFileSync('/tmp/status.json','utf8'));
                  process.stdout.write((b.artifacts && b.artifacts.buildUrl) || '');
                ")
                {
                  echo ""
                  echo "### ✅ Build finished"
                  [ -n "$APK" ] && echo "👉 **[Download the APK]($APK)**"
                } >> $GITHUB_STEP_SUMMARY
                echo "APK: ${APK:-<none>}"
                exit 0
                ;;
              ERRORED|CANCELED)
                {
                  echo ""
                  echo "### ❌ Build $STATUS"
                  echo "See the [build logs]($BUILD_PAGE)."
                } >> $GITHUB_STEP_SUMMARY
                echo "::error::EAS build $STATUS — see $BUILD_PAGE"
                exit 1
                ;;
            esac
            sleep 30
          done
