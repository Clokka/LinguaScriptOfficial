name: Deploy website to Cloudflare

# Every push to main builds the site (npx vite build → dist/) and publishes it
# to the Cloudflare Worker in wrangler.jsonc, so linguascript.co.uk always
# shows main. Needs two repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (right-hand side)
# Without them the job says so and stops, instead of failing every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare secrets are set
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22  # Wrangler 4 needs Node >= 22.12
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: npx vite build

      - name: Publish to Cloudflare
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action's default (3.90) can't deploy an assets-only Worker ("Missing entry-point").
          wranglerVersion: "4.168.0"
          command: deploy
